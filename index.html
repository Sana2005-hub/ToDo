<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: linear-gradient(135deg, #667eea, #764ba2);
    --card: #ffffff;
    --text: #333;
    --task: #f4f4f4;
    --btn: #764ba2;
}

body.dark {
    --bg: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    --card: #1f2933;
    --text: #f1f5f9;
    --task: #374151;
    --btn: #38bdf8;
}

body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.4s;
}

.todo-box {
    background: var(--card);
    width: 360px;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 15px 25px rgba(0,0,0,0.25);
    color: var(--text);
    transition: 0.4s;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h2 {
    font-weight: 600;
}

.toggle {
    cursor: pointer;
    font-size: 20px;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    background: var(--btn);
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

ul {
    list-style: none;
    padding: 0;
    margin-top: 20px;
}

li {
    background: var(--task);
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
}

.task {
    display: flex;
    gap: 10px;
    align-items: center;
}

.completed span {
    text-decoration: line-through;
    opacity: 0.6;
}

.delete {
    background: crimson;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
    color: white;
}
</style>
</head>

<body>

<div class="todo-box">
    <div class="header">
        <h2>📝 My To-Do</h2>
        <span class="toggle" onclick="toggleMode()">🌙</span>
    </div>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Add something productive…">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return alert("Please enter a task!");

    const li = document.createElement("li");
    li.innerHTML = `
        <div class="task">
            <input type="checkbox" onchange="toggleTask(this)">
            <span>${text}</span>
        </div>
        <button class="delete" onclick="this.parentElement.remove()">✖</button>
    `;

    document.getElementById("taskList").appendChild(li);
    input.value = "";
}

function toggleTask(cb) {
    cb.closest("li").classList.toggle("completed");
}

function toggleMode() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
